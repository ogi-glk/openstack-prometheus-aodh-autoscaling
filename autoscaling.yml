---
# ==============================================================================
# OpenStack Prometheus Autoscaling Deployment Playbook
# Usage:
#   openstack-ansible autoscaling.yml
#   ansible-playbook -i <inventory> autoscaling.yml
# ==============================================================================
- name: Deploy OpenStack Prometheus Autoscaling Layer
  hosts: "{{ autoscaling_target_hosts | default('compute_hosts:all[0]') }}"
  become: true
  roles:
    - role: "{{ playbook_dir }}"
