global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: 'libvirt'
    static_configs:
      - targets: ['localhost:9177']

  - job_name: 'openstack-server-group'
    static_configs:
      - targets: ['localhost:9102']
