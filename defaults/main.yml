---
# os_prometheus_autoscaling / defaults / main.yml
# ==============================================================================
# Prometheus Tabanlı OpenStack Autoscaling Varsayılan Değişkenleri
# ==============================================================================

# 1. Dizin ve Kullanıcı Yapılandırması
autoscaling_install_dir: "/opt/openstack-autoscaling"
autoscaling_venv_dir: "/opt/openstack-autoscaling/venv"
autoscaling_service_user: "root"
autoscaling_service_group: "root"

# 2. Prometheus & Alertmanager Ayarları
prometheus_version: "2.51.0"
prometheus_port: 9090
alertmanager_version: "0.27.0"
alertmanager_port: 9093

# 3. Exporter ve Webhook Adaptör Portları
libvirt_exporter_port: 9177
server_group_exporter_port: 9102
heat_signal_adapter_port: 9200

# 4. Autoscaling Eşik Değerleri ve Tetikleme Kuralları
autoscaling_cpu_high_threshold: 70     # %70'in üzerine çıkarsa (Scale-Out: +1 VM)
autoscaling_cpu_low_threshold: 20      # %20'nin altına düşerse (Scale-In: -1 VM)
autoscaling_evaluation_period: "60s"   # Alarmın tetiklenmesi için gereken süre
autoscaling_alarm_cooldown: "2m"       # İki alarm arasındaki bekleme süresi

# 5. OpenStack Keystone ve Heat Yapılandırması
openstack_auth_url: "https://{{ external_lb_vip_address | default('10.8.133.154') }}:5000/v3"
openstack_username: "admin"
openstack_password: "{{ keystone_auth_admin_password | default('') }}"
openstack_project_name: "admin"
openstack_user_domain_name: "Default"
openstack_project_domain_name: "Default"

# 6. Heat Stack ve Webhook URL'leri (Otomatik Keşfedilir veya Elle Girilebilir)
heat_stack_name: "autoscaling-stack"
heat_scaleup_url: ""
heat_scaledown_url: ""
