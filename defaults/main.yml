---
# os_prometheus_aodh_autoscaling / defaults / main.yml
# ==============================================================================
# OpenStack Prometheus + Aodh Autoscaling Default Variables
# ==============================================================================

# 1. Directories and Service User Configuration
autoscaling_install_dir: "/opt/openstack-autoscaling"
autoscaling_venv_dir: "/opt/openstack-autoscaling/venv"
autoscaling_service_user: "root"
autoscaling_service_group: "root"

# 2. Prometheus and Exporters Settings
prometheus_version: "2.51.0"
prometheus_port: 9090
libvirt_exporter_port: 9177
server_group_exporter_port: 9102
server_group_exporter_cache_ttl: 60    # Background thread refreshes Nova metadata once every 60s

# 3. OpenStack Keystone Configuration
openstack_auth_url: "http://{{ internal_lb_vip_address | default('172.29.236.101') }}:5000/v3"
openstack_username: "admin"
openstack_password: "{{ keystone_auth_admin_password | default('') }}"
openstack_project_name: "admin"
openstack_user_domain_name: "Default"
openstack_project_domain_name: "Default"

# 4. Aodh Prometheus Integration
aodh_prometheus_url: "http://{{ internal_lb_vip_address | default('172.29.236.101') }}:9090"