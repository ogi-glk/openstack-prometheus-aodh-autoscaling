---
# tasks/aodh.yml - Idempotent OpenStack Aodh Automated Setup & Prometheus Integration

# 1. TESPİT: Aodh sistemde zaten kurulu mu?
- name: Check if aodh-evaluator binary is already installed
  ansible.builtin.command: which aodh-evaluator
  register: aodh_evaluator_check
  failed_when: false
  changed_when: false

- name: Check if /etc/aodh/aodh.conf already exists
  ansible.builtin.stat:
    path: /etc/aodh/aodh.conf
  register: aodh_conf_stat

- name: Set fact whether Aodh is already installed
  ansible.builtin.set_fact:
    aodh_is_installed: "{{ aodh_evaluator_check.rc == 0 and aodh_conf_stat.stat.exists }}"

- name: Announce Aodh detection result
  ansible.builtin.debug:
    msg: >
      {% if aodh_is_installed %}
      [+] Aodh binaries and config detected. Applying/verifying configuration and services.
      {% else %}
      [*] Aodh is NOT installed. Starting full automated installation (Packages, Keystone, Database, Config).
      {% endif %}

# 2. KURULUM (Sadece Aodh kurulu değilse çalışır)
- name: Install Aodh system packages via APT
  ansible.builtin.apt:
    name:
      - aodh-api
      - aodh-evaluator
      - aodh-notifier
      - aodh-listener
      - python3-aodhclient
      - crudini
    state: present
    update_cache: true
  when: not aodh_is_installed

- name: Ensure /etc/aodh directory exists
  ansible.builtin.file:
    path: /etc/aodh
    state: directory
    mode: '0750'
    owner: aodh
    group: aodh
  when: not aodh_is_installed

- name: Setup Keystone Service, User and Endpoints for Aodh
  ansible.builtin.shell: |
    source {{ autoscaling_install_dir }}/openrc

    # 1. Service oluştur (yoksa)
    openstack service show alarming >/dev/null 2>&1 || \
      openstack service create --name aodh --description "OpenStack Alarming Service" alarming

    # 2. Service kullanıcısı oluştur (yoksa)
    openstack user show {{ aodh_service_user }} >/dev/null 2>&1 || \
      openstack user create --domain default --password "{{ aodh_service_password }}" {{ aodh_service_user }}

    # 3. Admin rolü ver
    openstack role add --project {{ aodh_service_project }} --user {{ aodh_service_user }} admin

    # 4. Endpoints oluştur (yoksa)
    ENDPOINT_EXISTS=$(openstack endpoint list --service alarming -f value -c ID | wc -l)
    if [ "$ENDPOINT_EXISTS" -eq 0 ]; then
      openstack endpoint create --region RegionOne alarming public "http://{{ aodh_db_host }}:{{ aodh_port }}"
      openstack endpoint create --region RegionOne alarming internal "http://{{ aodh_db_host }}:{{ aodh_port }}"
      openstack endpoint create --region RegionOne alarming admin "http://{{ aodh_db_host }}:{{ aodh_port }}"
    fi
  failed_when: false

- name: Deploy full aodh.conf configuration
  ansible.builtin.template:
    src: aodh.conf.j2
    dest: /etc/aodh/aodh.conf
    owner: aodh
    group: aodh
    mode: '0640'
  when: not aodh_is_installed

- name: Run Aodh Database Sync (dbsync)
  ansible.builtin.command: su -s /bin/sh -c "aodh-dbsync" aodh
  failed_when: false

# 3. SERVİS BAŞLATMA (Ubuntu'da aodh-api Apache2 mod_wsgi üzerinden çalışır)
- name: Enable aodh-api site in Apache2 and start web server
  ansible.builtin.shell: |
    if [ -f /etc/apache2/sites-available/aodh-api.conf ]; then
      a2ensite aodh-api 2>/dev/null || true
      systemctl enable --now apache2 2>/dev/null || true
      systemctl restart apache2 2>/dev/null || true
    fi
  failed_when: false

- name: Enable and start Aodh background daemon services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - aodh-evaluator
    - aodh-notifier
    - aodh-listener

# 4. PROMETHEUS ENTEGRASYONU (Her zaman doğrulanır)
- name: Ensure Prometheus URL is configured in /etc/aodh/aodh.conf
  community.general.ini_file:
    path: /etc/aodh/aodh.conf
    section: prometheus
    option: url
    value: "{{ aodh_prometheus_url }}"
    mode: '0640'
    owner: aodh
    group: aodh
  notify:
    - Restart aodh-evaluator
    - Restart aodh-notifier