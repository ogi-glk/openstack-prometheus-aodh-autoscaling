---
# tasks/aodh.yml - Idempotent OpenStack Aodh Automated Setup & Prometheus Integration

# 1. TESPİT: Aodh sistemde zaten kurulu mu?
- name: Check if aodh-evaluator binary is already installed
  ansible.builtin.command: which aodh-evaluator
  register: aodh_evaluator_check
  failed_when: false
  changed_when: false

- name: Check if /etc/aodh/aodh.conf already exists
  ansible.builtin.stat:
    path: /etc/aodh/aodh.conf
  register: aodh_conf_stat

- name: Set fact whether Aodh is already installed
  ansible.builtin.set_fact:
    aodh_is_installed: "{{ aodh_evaluator_check.rc == 0 and aodh_conf_stat.stat.exists }}"

- name: Announce Aodh detection result
  ansible.builtin.debug:
    msg: >
      {% if aodh_is_installed %}
      [+] Aodh binaries and config detected. Applying/verifying configuration and services.
      {% else %}
      [*] Aodh is NOT installed. Starting full automated installation (Packages, Keystone, Database, Config).
      {% endif %}

# 2. KURULUM (Sadece Aodh kurulu değilse çalışır)
- name: Install Aodh system packages via APT
  ansible.builtin.apt:
    name:
      - aodh-api
      - aodh-evaluator
      - aodh-notifier
      - aodh-listener
      - python3-aodhclient
      - crudini
    state: present
    update_cache: true
  when: not aodh_is_installed

- name: Ensure /etc/aodh directory exists with proper permissions
  ansible.builtin.file:
    path: /etc/aodh
    state: directory
    mode: '0755'
    owner: aodh
    group: aodh

- name: Add www-data user to aodh group for Apache WSGI file access
  ansible.builtin.user:
    name: www-data
    groups: aodh
    append: true

- name: Deploy full aodh.conf configuration
  ansible.builtin.template:
    src: aodh.conf.j2
    dest: /etc/aodh/aodh.conf
    owner: aodh
    group: aodh
    mode: '0644'

- name: Configure Apache2 for Aodh API (disable default port 80/443 collision)
  ansible.builtin.shell: |
    sed -i 's/^Listen 80/# Listen 80/' /etc/apache2/ports.conf
    sed -i 's/^Listen 443/# Listen 443/' /etc/apache2/ports.conf
    sed -i '/Listen {{ aodh_port }}/d' /etc/apache2/ports.conf
    a2dissite 000-default 2>/dev/null || true
    a2enmod wsgi 2>/dev/null || true
    a2ensite aodh-api 2>/dev/null || true
    systemctl daemon-reload
    systemctl enable --now apache2 2>/dev/null || true
    systemctl restart apache2 2>/dev/null || true
  failed_when: false

# 3. KEYSTONE ENTEGRASYONU
- name: Setup Keystone Service, User and Endpoints for Aodh
  ansible.builtin.shell: |
    openstack service show alarming >/dev/null 2>&1 || \
      openstack service create --name aodh --description "OpenStack Alarming Service" alarming

    openstack user show {{ aodh_service_user }} >/dev/null 2>&1 || \
      openstack user create --domain default --password "{{ aodh_service_password }}" {{ aodh_service_user }}

    openstack role add --project {{ aodh_service_project }} --user {{ aodh_service_user }} admin

    openstack endpoint show alarming >/dev/null 2>&1 || {
      openstack endpoint create --region RegionOne alarming public "http://{{ aodh_db_host }}:{{ aodh_port }}"
      openstack endpoint create --region RegionOne alarming internal "http://{{ aodh_db_host }}:{{ aodh_port }}"
      openstack endpoint create --region RegionOne alarming admin "http://{{ aodh_db_host }}:{{ aodh_port }}"
    }
  environment:
    OS_AUTH_URL: "{{ openstack_auth_url }}"
    OS_PROJECT_NAME: "{{ openstack_project_name }}"
    OS_USERNAME: "{{ openstack_username }}"
    OS_PASSWORD: "{{ openstack_password }}"
    OS_USER_DOMAIN_NAME: "{{ openstack_user_domain_name }}"
    OS_PROJECT_DOMAIN_NAME: "{{ openstack_project_domain_name }}"
    OS_IDENTITY_API_VERSION: "3"
  failed_when: false

# 4. ARKA PLAN SERVİSLERİNİ BAŞLATMA
- name: Enable and start Aodh background daemon services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - aodh-evaluator
    - aodh-notifier
    - aodh-listener

- name: Ensure /etc/openstack directory exists
  ansible.builtin.file:
    path: /etc/openstack
    state: directory
    mode: '0755'

- name: Deploy /etc/openstack/prometheus.yaml configuration for observabilityclient
  ansible.builtin.copy:
    dest: /etc/openstack/prometheus.yaml
    mode: '0644'
    content: |
      host: "{{ aodh_prometheus_host | default('127.0.0.1') }}"
      port: {{ aodh_prometheus_port | default(9090) }}
  notify:
    - Restart aodh-evaluator
    - Restart aodh-notifier

# 5. PROMETHEUS ENTEGRASYONU (observabilityclient requires explicit host and port)
- name: Ensure Prometheus host, port and URL are configured in /etc/aodh/aodh.conf
  community.general.ini_file:
    path: /etc/aodh/aodh.conf
    section: prometheus
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
    owner: aodh
    group: aodh
  loop:
    - { option: 'host', value: "{{ aodh_prometheus_host | default('127.0.0.1') }}" }
    - { option: 'port', value: "{{ aodh_prometheus_port | default(9090) }}" }
    - { option: 'url', value: "{{ aodh_prometheus_url | default('http://127.0.0.1:9090') }}" }
  notify:
    - Restart aodh-evaluator
    - Restart aodh-notifier
# 6. UBUNTU 24.04 / PYTHON 3.12 OSPROFILER SQLALCHEMY UYUMLULUK YAMASI
- name: Apply backwards-compatible patch for osprofiler SQLAlchemy 2.0 chained_exception
  ansible.builtin.shell: |
    python3 -c "
    import os
    path = '/usr/lib/python3/dist-packages/osprofiler/sqlalchemy.py'
    if os.path.exists(path):
        with open(path, 'r') as f:
            content = f.read()
        old = 'chained_exception = str(exception_context.chained_exception)'
        new = 'chained_exception = str(getattr(exception_context, \"chained_exception\", getattr(exception_context, \"original_exception\", \"\")))'
        if old in content:
            with open(path, 'w') as f:
                f.write(content.replace(old, new))
    "
  failed_when: false

# 7. HEAT CFN EC2AUTHTOKEN YAPILANDIRMASI (alarm_url imza doğrulaması için zorunlu)
- name: Detect Heat API LXC container name
  ansible.builtin.shell: "lxc-ls -1 | grep heat-api | head -n 1"
  register: heat_container_name
  failed_when: false
  changed_when: false

- name: Ensure Heat CFN ec2authtoken has Keystone service credentials
  ansible.builtin.shell: |
    HEAT="{{ heat_container_name.stdout | trim }}"
    if [ -n "$HEAT" ]; then
      lxc-attach -n "$HEAT" -- python3 -c "
    conf_path = '/etc/heat/heat.conf'
    with open(conf_path) as f:
        content = f.read()
    old = '[ec2authtoken]\nauth_uri = http://{{ internal_lb_vip_address | default(\"172.29.236.101\") }}:5000'
    new = '''[ec2authtoken]
    auth_uri = http://{{ internal_lb_vip_address | default(\"172.29.236.101\") }}:5000
    auth_url = {{ openstack_auth_url }}
    auth_type = password
    username = heat
    password = {{ heat_service_password | default(\"CHANGE_ME\") }}
    project_name = service
    user_domain_id = default
    project_domain_id = default'''
    if 'auth_type' not in content.split('[ec2authtoken]')[-1].split('[')[0]:
        with open(conf_path, 'w') as f:
            f.write(content.replace(old, new))
        print('[+] ec2authtoken credentials added')
    else:
        print('[*] ec2authtoken already configured')
    "
      lxc-attach -n "$HEAT" -- systemctl restart heat-api-cfn
      echo "[+] Heat CFN restarted"
    else
      echo "[*] No Heat container found, skipping"
    fi
  failed_when: false