---
# os_prometheus_autoscaling / tasks / prerequisites.yml

- name: Gerekli sistem paketlerini kur
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - tar
      - curl
      - jq
      - prometheus-node-exporter
    state: present
    update_cache: true

- name: Autoscaling Ã§alÄ±ÅŸma dizinlerini oluÅŸtur
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ autoscaling_service_user }}"
    group: "{{ autoscaling_service_group }}"
  loop:
    - "{{ autoscaling_install_dir }}"
    - "{{ autoscaling_install_dir }}/adapter"
    - "{{ autoscaling_install_dir }}/exporters"
    - "/etc/prometheus"
    - "/etc/alertmanager"
    - "/var/lib/prometheus"
    - "/var/lib/alertmanager"

- name: Ä°zole Python sanal ortamÄ±nÄ± (venv) oluÅŸtur
  ansible.builtin.command:
    cmd: "python3 -m venv {{ autoscaling_venv_dir }}"
    creates: "{{ autoscaling_venv_dir }}/bin/python3"

- name: Python baÄŸÄ±mlÄ±lÄ±klarÄ±nÄ± venv iÃ§ine kur
  ansible.builtin.pip:
    name:
      - openstacksdk
      - prometheus-client
      - requests
      - urllib3
    virtualenv: "{{ autoscaling_venv_dir }}"
    state: present

- name: OpenStack kimlik dosyasÄ±nÄ± (openrc) oluÅŸtur
  ansible.builtin.template:
    src: openrc.j2
    dest: "{{ autoscaling_install_dir }}/openrc"
    mode: '0600'
    owner: "{{ autoscaling_service_user }}"
    group: "{{ autoscaling_service_group }}"

- name: openrc dosyasındaki olası Windows BOM ve CRLF karakterlerini temizle
  ansible.builtin.shell:
    cmd: "sed -i '1s/^\xef\xbb\xbf//; s/\r$//' {{ autoscaling_install_dir }}/openrc"
  changed_when: false