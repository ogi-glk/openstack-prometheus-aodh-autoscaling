---
# os_prometheus_autoscaling / tasks / prerequisites.yml

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - tar
      - curl
      - jq
      - prometheus-node-exporter
      - prometheus-libvirt-exporter
    state: present
    update_cache: true

- name: Create autoscaling working directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ autoscaling_service_user }}"
    group: "{{ autoscaling_service_group }}"
  loop:
    - "{{ autoscaling_install_dir }}"
    - "{{ autoscaling_install_dir }}/adapter"
    - "{{ autoscaling_install_dir }}/exporters"
    - "/etc/prometheus"
    - "/etc/alertmanager"
    - "/var/lib/prometheus"
    - "/var/lib/alertmanager"

- name: Create isolated Python virtual environment (venv)
  ansible.builtin.command:
    cmd: "python3 -m venv {{ autoscaling_venv_dir }}"
    creates: "{{ autoscaling_venv_dir }}/bin/python3"

- name: Install Python dependencies inside venv
  ansible.builtin.pip:
    name:
      - openstacksdk
      - prometheus-client
      - requests
      - urllib3
    virtualenv: "{{ autoscaling_venv_dir }}"
    state: present

- name: Template OpenStack credential file (openrc)
  ansible.builtin.template:
    src: openrc.j2
    dest: "{{ autoscaling_install_dir }}/openrc"
    mode: '0600'
    owner: "{{ autoscaling_service_user }}"
    group: "{{ autoscaling_service_group }}"

- name: Sanitize openrc file against Windows line endings and BOM
  ansible.builtin.shell: |
    tr -d '\r' < {{ autoscaling_install_dir }}/openrc > /tmp/openrc.clean && mv /tmp/openrc.clean {{ autoscaling_install_dir }}/openrc
    sed -i '1s/^\xef\xbb\xbf//' {{ autoscaling_install_dir }}/openrc 2>/dev/null || true
  changed_when: false