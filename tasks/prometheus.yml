---
# tasks/prometheus.yml

- name: Download and unpack Prometheus binary archive
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Install Prometheus binaries to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - prometheus
    - promtool

- name: Download and unpack Alertmanager binary archive
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"

- name: Install Alertmanager binaries to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - alertmanager
    - amtool

- name: Create Prometheus systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Monitoring System
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Create Alertmanager systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/alertmanager.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Alertmanager
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/var/lib/alertmanager/
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Deploy Prometheus configuration (prometheus.yml)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "/etc/prometheus/prometheus.yml"
    mode: '0644'
  notify: Restart prometheus

- name: Deploy Prometheus alert rules (alert_rules.yml)
  ansible.builtin.template:
    src: alert_rules.yml.j2
    dest: "/etc/prometheus/alert_rules.yml"
    mode: '0644'
  notify: Restart prometheus

- name: Deploy Alertmanager configuration (alertmanager.yml)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "/etc/alertmanager/alertmanager.yml"
    mode: '0644'
  notify: Restart alertmanager

- name: Ensure Prometheus, Alertmanager, and Libvirt Exporter services are running and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - prometheus
    - alertmanager
    - prometheus-libvirt-exporter