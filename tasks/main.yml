---
# os_prometheus_autoscaling / tasks / main.yml
# ==============================================================================
# OpenStack Prometheus Autoscaling Deployment Tasks
# ==============================================================================

- name: 1. Install prerequisites and system packages
  ansible.builtin.import_tasks: prerequisites.yml
  tags:
    - autoscaling-prereqs

- name: 2. Deploy Prometheus and Alertmanager
  ansible.builtin.import_tasks: prometheus.yml
  tags:
    - autoscaling-prometheus

- name: 3. Deploy Heat Webhook Adapter and Exporter services
  ansible.builtin.import_tasks: adapter.yml
  tags:
    - autoscaling-adapter